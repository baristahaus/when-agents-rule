name: ci

# Nothing in this repo ran automatically before this file: 328 unit tests and two browser
# suites existed, and all of it depended on someone remembering. Every command below was
# executed locally before being written here. The one thing that cannot be is the GitHub
# runner itself, so the first scheduled run of the browser job is that job's real test.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:17 UTC — off the hour on purpose, because scheduled jobs queued at the :00 mark
    # wait behind everything else that remembers the top of the hour.
    - cron: '17 4 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the tag check below has to read index.html as it stood on the
          # base commit. Depth 1 (the default) would make every comparison against a base fail
          # with "path not found", which looks like a broken repo rather than a shallow clone.
          fetch-depth: 0

      # The repo's one convention that nothing can see by looking at a diff: a changed shipped
      # script must get a new ?v= in index.html, or browsers keep running the file they cached.
      # It has been broken before, silently, because the symptom is only on someone ELSE's
      # machine — they see the old build and it looks like the fix did not work. And the on-screen
      # build number is read from js/game.js's tag, so a change elsewhere that leaves game.js's tag
      # alone under-reports the build too. Both halves are checked here, against the real base.
      - name: Cache-busting tags moved with the files they version
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE:index.html" 2>/dev/null; then
            echo "::warning::no readable base commit, so the tag check had nothing to compare against"
            exit 0
          fi
          echo "comparing against $BASE"
          tag_of() {  # $1 = index.html ref, $2 = script path
            git show "$1" 2>/dev/null | sed -n "s|.*src=\"$2?v=\([0-9]*\)\".*|\1|p" | head -1
          }
          changed="$(git diff --name-only "$BASE" HEAD -- 'js/' | grep '\.js$' || true)"
          if [ -z "$changed" ]; then echo "no shipped scripts changed"; exit 0; fi
          echo "$changed" | sed 's/^/  changed: /'
          fail=0
          game_old="$(tag_of "$BASE:index.html" js/game.js)"; game_new="$(tag_of HEAD:index.html js/game.js)"
          if [ "$game_old" = "$game_new" ]; then
            echo "::error::js/game.js is still ?v=$game_old while shipped scripts changed — the build badge under-reports"; fail=1
          fi
          for f in $changed; do
            old="$(tag_of "$BASE:index.html" "$f")"; new="$(tag_of HEAD:index.html "$f")"
            if [ -z "$new" ]; then echo "::error::$f changed but is not referenced with a ?v= tag in index.html"; fail=1; continue; fi
            if [ "$old" = "$new" ]; then echo "::error::$f changed but its tag is still ?v=$new"; fail=1; fi
          done
          [ "$fail" = 0 ] && echo "every changed script carries a new tag"
          exit "$fail"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app has no dependencies, so there is no install step to be slow or to break.
      # If that ever changes, this comment is the thing to delete.
      - name: Syntax-check every shipped script
        run: |
          set -e
          for f in js/*.js js/engine/*.js tests/*.test.cjs tests/browser/*.cjs; do
            node --check "$f"
          done

      - name: The JSON the product promises must parse
        run: |
          node -e 'const f=require("fs");for(const p of ["game-state-schema.json","samples/index.json"])JSON.parse(f.readFileSync(p,"utf8"));'

      - name: Tests
        run: node --test tests/*.test.cjs

  # The two Playwright suites, nightly and on demand — deliberately not on every push.
  #
  # They are the only regression guard for the escaping and showcase-mode work (a property of
  # the parsed DOM, which no unit test can reach) and the only thing that looks at what a
  # player actually sees. They stay off push because each run downloads a ~170 MB browser,
  # and a check that goes red because a CDN hiccuped trains everyone to ignore the check.
  # Nightly keeps the signal without holding a push hostage to it; workflow_dispatch is
  # "run it now, before I ship".
  #
  # The commands below are the ones that pass on the machine this file was written on (Node
  # 22, Playwright 1.49.1, Chromium in software GL through --enable-unsafe-swiftshader, which
  # both suites already pass themselves). The runner is the one part that cannot be exercised
  # locally, so the first scheduled run is the real test of this job.
  browser:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --no-save so package.json stays the dependency-free manifest the app ships with;
      # node_modules exists only inside this job's workspace.
      - name: Install Playwright and Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      # One step, not two: npm run test:browser runs the suites sequentially, and run
      # concurrently they contend for the software GL stack until a scenario misses its own
      # boot timeout and reports a failure that is not in the app.
      - name: Browser suites
        env:
          WAR_PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
          WAR_QA_DIR: ${{ runner.temp }}/qa
        run: npm run test:browser

      - name: Keep the screenshots whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: ${{ runner.temp }}/qa
          if-no-files-found: ignore
