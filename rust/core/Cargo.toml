[package]
name = "war-core"
version = "0.1.0"
edition = "2021"
description = "The deterministic simulation core of When Agents Rule, golden-diffed against the JS reference"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# serde_json's `preserve_order` switches `serde_json::Map` onto `indexmap`,
# but does not enable `indexmap/serde` (its `default` no longer includes
# `serde` as of indexmap 2.13), so the alias has no Serialize/Deserialize
# impls. Enable the feature directly: this crate's state types derive over
# `serde_json::Map` fields.
indexmap = { version = "2", features = ["serde"] }
regex = "1"

[lib]
name = "war_core"
path = "src/lib.rs"

[[bin]]
name = "golden-diff"
path = "src/bin/golden_diff.rs"
